<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pengaturan Situs — Admin CMS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#006659}a:hover{color:#004d43}
</style>
</helmet>
<div style="font-family: Manrope, sans-serif; color: #10201d; background: #F5F7F6; display: flex; flex-wrap: wrap; min-height: 1250px">
  <div style="flex: 0 0 264px"><dc-import name="AdminSidebar" active="pengaturan" hint-size="264px,1050px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 28px 36px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
      <div>
        <h1 style="margin: 0; font-size: 28px; font-weight: 800">Pengaturan Situs</h1>
        <p style="margin: 4px 0 0; font-size: 14px; color: #55615e">Identitas, kontak, menu, integrasi, dan tombol melayang.</p>
      </div>
      <button type="button" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 0; background: #006659; color: #fff; font: 800 14px Manrope, sans-serif">Simpan</button>
    </header>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px">
      <section style="background: #fff; border: 1px solid #e2e7e5; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0 0 4px; font-size: 17px; font-weight: 800">Identitas</h2>
        <label for="sn" style="font-size: 12px; font-weight: 700; color: #55615e">Nama situs</label>
        <input id="sn" value="Relawan Nusantara" style="height: 42px; border: 1px solid #cfd6d4; border-radius: 10px; padding: 0 12px; font: 600 14px Manrope, sans-serif">
        <label for="tg" style="font-size: 12px; font-weight: 700; color: #55615e">Tagline</label>
        <input id="tg" value="Berawal dari Kepedulian, Bergerak Menjadi Jembatan Kebaikan" style="height: 42px; border: 1px solid #cfd6d4; border-radius: 10px; padding: 0 12px; font: 600 14px Manrope, sans-serif">
        <div style="display: flex; gap: 12px; margin-top: 4px">
          <div style="flex: 1; border: 1px dashed #9fb3ae; border-radius: 10px; padding: 14px; font-size: 13px; text-align: center">Logo (SVG/PNG)<br><a href="#ganti" style="font-weight: 700">Ganti</a></div>
          <div style="flex: 1; border: 1px dashed #9fb3ae; border-radius: 10px; padding: 14px; font-size: 13px; text-align: center">Favicon<br><a href="#ganti" style="font-weight: 700">Ganti</a></div>
        </div>
      </section>

      <section style="background: #fff; border: 1px solid #e2e7e5; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0 0 4px; font-size: 17px; font-weight: 800">Kontak &amp; Sosial</h2>
        <label for="wa" style="font-size: 12px; font-weight: 700; color: #55615e">WhatsApp</label>
        <input id="wa" value="+62 853-5341-5664" style="height: 42px; border: 1px solid #cfd6d4; border-radius: 10px; padding: 0 12px; font: 600 14px Manrope, sans-serif">
        <label for="em" style="font-size: 12px; font-weight: 700; color: #55615e">Email</label>
        <input id="em" value="admin@relawannusantara.org" style="height: 42px; border: 1px solid #cfd6d4; border-radius: 10px; padding: 0 12px; font: 600 14px Manrope, sans-serif">
        <label for="ad" style="font-size: 12px; font-weight: 700; color: #55615e">Alamat</label>
        <textarea id="ad" rows="2" style="border: 1px solid #cfd6d4; border-radius: 10px; padding: 8px 12px; font: 600 14px Manrope, sans-serif">Ruko Magna Commercial Blok MB 50-52, Summarecon, Bandung, Kota Bandung, Jawa Barat 40295</textarea>
        <p style="margin: 4px 0 0; font-size: 13px; color: #55615e">Instagram · Facebook · YouTube · Threads · LinkedIn · TikTok — <a href="#sosial" style="font-weight: 700">Kelola tautan</a></p>
      </section>

      <section style="background: #fff; border: 1px solid #e2e7e5; border-radius: 14px; padding: 20px">
        <h2 style="margin: 0; font-size: 17px; font-weight: 800">Menu navigasi</h2>
        <ul style="margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
          <sc-for list="{{menu}}" as="m" hint-placeholder-count="10">
            <li style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid #e2e7e5; border-radius: 10px; margin-left: {{m.indent}}"><span aria-hidden="true" style="color: #9fb3ae; font-weight: 800">⋮⋮</span><span style="flex: 1; font-weight: 700">{{m.label}}</span><span style="font-size: 12px; color: #55615e">{{m.href}}</span></li>
          </sc-for>
        </ul>
      </section>

      <section style="background: #fff; border: 1px solid #e2e7e5; border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0 0 4px; font-size: 17px; font-weight: 800">Integrasi &amp; tombol</h2>
        <label for="ga" style="font-size: 12px; font-weight: 700; color: #55615e">Google Analytics 4</label>
        <input id="ga" value="G-V2B0DLDRX6" style="height: 42px; border: 1px solid #cfd6d4; border-radius: 10px; padding: 0 12px; font: 600 14px Manrope, sans-serif">
        <label for="px" style="font-size: 12px; font-weight: 700; color: #55615e">Meta Pixel</label>
        <input id="px" value="362997751405076" style="height: 42px; border: 1px solid #cfd6d4; border-radius: 10px; padding: 0 12px; font: 600 14px Manrope, sans-serif">
        <label for="dn" style="font-size: 12px; font-weight: 700; color: #55615e">Tautan tombol Donasi</label>
        <input id="dn" value="/campaign" style="height: 42px; border: 1px solid #cfd6d4; border-radius: 10px; padding: 0 12px; font: 600 14px Manrope, sans-serif">
        <label style="display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 700; margin-top: 4px"><input type="checkbox" checked style="width: 18px; height: 18px"> Tampilkan tombol “Tanya Saffa” (WhatsApp)</label>
        <label style="display: flex; gap: 10px; align-items: center; font-size: 14px; font-weight: 700"><input type="checkbox" checked style="width: 18px; height: 18px"> Mode perawatan nonaktif</label>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1250}}'>
class Component extends DCLogic {
  renderVals() {
    const menu = [
      ['Beranda', '/', 0], ['Tentang Kami', '—', 0], ['Profil Relawan Nusantara', '/profil-relawan-nusantara/', 1], ['Audit Keuangan', '/audit-keuangan/', 1], ['Legalitas', '/asas-legalitas/', 1],
      ['Program Kami', '—', 0], ['Publikasi', '—', 0], ['Kemitraan', '/kemitraan/', 0]
    ].map(([label, href, lvl]) => ({ label, href, indent: lvl ? '24px' : '0' }));
    return { menu };
  }
}
</script>
</body>
</html>
