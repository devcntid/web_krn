<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>e-Report — Relawan Nusantara</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700;1,800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#006659}a:hover{color:#004d43}
.ph{background:#cfd8d4;color:#2d4a44;display:flex;align-items:center;justify-content:center;text-align:center;font:600 13px/1.4 Poppins,sans-serif}
</style>
</helmet>
<div style="font-family: Poppins, sans-serif; color: #000; background: #fff; position: relative">
  <div style="position: absolute; top: 0; left: 0; right: 0; z-index: 5">
    <dc-import name="SiteHeader" variant="accent" hint-size="100%,116px"></dc-import>
  </div>

  <header style="position: relative; min-height: 480px; display: flex; align-items: flex-end; background: #5f6e66">
    <span class="ph" style="position: absolute; inset: 0; background: #6a7a71; color: rgba(255,255,255,.75)">FOTO HERO · Penyaluran bantuan</span>
    <div style="position: relative; width: 80%; max-width: 1080px; margin: 0 auto; padding-bottom: 60px">
      <h1 style="margin: 0; font-size: 64px; line-height: 1.1; color: #fff">e-Reporting</h1>
      <p style="margin: 10px 0 0; font-size: 18px; color: rgba(255,255,255,.92)">Laporan penyaluran program dalam format flipbook.</p>
    </div>
  </header>

  <section style="padding: 64px 0 88px; background: #F2F6F8">
    <div style="width: 80%; max-width: 1080px; margin: 0 auto">
      <div style="display: flex; gap: 12px; flex-wrap: wrap" role="group" aria-label="Filter tema">
        <button type="button" style="height: 40px; padding: 0 20px; border-radius: 10px; border: 2px solid #006659; background: #006659; color: #fff; font: 500 14px Poppins, sans-serif">Semua</button>
        <button type="button" style="height: 40px; padding: 0 20px; border-radius: 10px; border: 2px solid #006659; background: #fff; color: #000; font: 500 14px Poppins, sans-serif">Palestina</button>
        <button type="button" style="height: 40px; padding: 0 20px; border-radius: 10px; border: 2px solid #006659; background: #fff; color: #000; font: 500 14px Poppins, sans-serif">Kurban &amp; Zakat</button>
        <button type="button" style="height: 40px; padding: 0 20px; border-radius: 10px; border: 2px solid #006659; background: #fff; color: #000; font: 500 14px Poppins, sans-serif">Penyaluran Bulanan</button>
      </div>
      <div style="margin-top: 32px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
        <sc-for list="{{reports}}" as="r" hint-placeholder-count="9">
          <article style="background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 18px rgba(0,0,0,.08); display: flex; flex-direction: column">
            <div class="ph" style="aspect-ratio: 3 / 4; background: #dfe7e4">SAMPUL LAPORAN</div>
            <div style="padding: 18px; display: flex; flex-direction: column; gap: 14px; flex: 1">
              <h2 style="margin: 0; font-size: 17px; line-height: 1.35">{{r.title}}</h2>
              <a href="#heyzine" style="margin-top: auto; align-self: flex-start; background: #006659; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600">Baca Laporan ↗</a>
            </div>
          </article>
        </sc-for>
      </div>
    </div>
  </section>

  <dc-import name="SiteFooter" hint-size="100%,560px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2000}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      reports: [
        'Laporan Penyaluran RN x Albahjah',
        'Laporan Penyaluran Juni 2025',
        'Report Zakat Kemanusiaan Palestina',
        'Report Kurban 1446H',
        'e-Report Penyaluran Iqra Al-Quran',
        'Aksi Nyata untuk Palestina',
        'Laporan Penyaluran Program Edisi November',
        'Laporan Penyaluran Bantuan untuk Palestina',
        'Pengiriman Bantuan Kemanusiaan Palestina'
      ].map((title) => ({ title }))
    };
  }
}
</script>
</body>
</html>
