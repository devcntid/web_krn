<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Header situs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700;1,800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#000}a:hover{color:#006659}
</style>
</helmet>
<div style="font-family: Poppins, sans-serif; color: #000; padding: 20px 24px; box-sizing: border-box; width: 100%">
  <header style="max-width: 1080px; margin: 0 auto; height: 76px; background: #ffffff; border-radius: 10px; border: 1px solid #dbdbdb; padding: 0 20px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 24px">
    <a href="Main.dc.html" aria-label="Relawan Nusantara — Beranda" style="display: flex; align-items: center; gap: 8px; text-decoration: none">
      <span style="width: 30px; height: 30px; border-radius: 4px; background: #006659; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px; box-sizing: border-box; gap: 3px">
        <span style="width: 5px; height: 15px; background: #fff"></span><span style="width: 5px; height: 11px; background: #fff"></span><span style="width: 5px; height: 15px; background: #fff"></span>
      </span>
      <span style="font-size: 15px; line-height: 15px; font-weight: 600; font-style: italic; color: #1d4d45">relawan<br>nusantara</span>
    </a>
    <nav aria-label="Menu utama" style="display: flex; align-items: center; gap: 22px; font-size: 15px; font-weight: 600">
      <a href="Main.dc.html" style="text-decoration: none">Beranda</a>
      <a href="Profil.dc.html" style="text-decoration: none; display: flex; align-items: center; gap: 4px">Tentang Kami <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></a>
      <a href="Pilar.dc.html" style="text-decoration: none; display: flex; align-items: center; gap: 4px">Program Kami <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></a>
      <a href="Publikasi.dc.html" style="text-decoration: none; display: flex; align-items: center; gap: 4px">Publikasi <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></a>
      <a href="Kemitraan.dc.html" style="text-decoration: none">Kemitraan</a>
      <a href="Arsip.dc.html" aria-label="Cari" style="display: flex"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a>
    </nav>
    <a href="#donasi" style="background: {{donateBg}}; color: {{donateFg}}; text-decoration: none; font-size: 13px; font-weight: 700; padding: 8px 20px; border-radius: 5px">Donasi</a>
  </header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["accent","primary"],"default":"accent"},"$preview":{"width":1440,"height":116}}'>
class Component extends DCLogic {
  renderVals() {
    const primary = (this.props.variant ?? 'accent') === 'primary';
    return { donateBg: primary ? '#006659' : '#F4A62A', donateFg: primary ? '#ffffff' : '#000000' };
  }
}
</script>
</body>
</html>
