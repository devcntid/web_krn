<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Menu mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700;1,800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#000}a:hover{color:#006659}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; font-family: Poppins, sans-serif; color: #000; background: #fff; display: flex; flex-direction: column">
  <header style="height: 60px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 3px solid #006659">
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 24px; height: 24px; border-radius: 3px; background: #006659"></span><span style="font-size: 12px; line-height: 12px; font-weight: 600; font-style: italic; color: #1d4d45">relawan<br>nusantara</span></span>
    <span style="display: flex; align-items: center; gap: 12px">
      <a href="#donasi" style="background: #F4A62A; color: #000; text-decoration: none; padding: 8px 18px; border-radius: 5px; font-size: 13px; font-weight: 700">Donasi</a>
      <a href="MobileBeranda.dc.html" aria-label="Tutup menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    </span>
  </header>

  <form role="search" style="padding: 16px; display: flex; gap: 8px">
    <label for="mq" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Cari</label>
    <input id="mq" type="search" placeholder="Cari publikasi…" style="flex: 1; height: 44px; border: 1px solid #cfd6d4; border-radius: 8px; padding: 0 14px; font: 400 14px Poppins, sans-serif">
    <button type="submit" aria-label="Cari" style="width: 44px; height: 44px; border: 0; border-radius: 8px; background: #006659; color: #fff">⌕</button>
  </form>

  <nav aria-label="Menu mobile" style="flex: 1; overflow: auto">
    <ul style="margin: 0; padding: 0; list-style: none">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
        <li style="border-bottom: 1px solid #eee">
          <sc-if value="{{it.hasChildren}}" hint-placeholder-val="{{false}}">
            <button type="button" aria-expanded="{{it.expanded}}" onClick="{{it.toggle}}" style="width: 100%; min-height: 52px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; border: 0; background: #fff; font: 600 16px Poppins, sans-serif; color: #000; cursor: pointer">
              <span>{{it.label}}</span><span aria-hidden="true" style="color: #006659; font-size: 20px">{{it.sign}}</span>
            </button>
            <sc-if value="{{it.open}}" hint-placeholder-val="{{false}}">
              <ul style="margin: 0; padding: 0 0 8px; list-style: none; background: #F2F6F8">
                <sc-for list="{{it.children}}" as="c" hint-placeholder-count="3">
                  <li><a href="{{c.href}}" style="display: block; padding: 12px 36px; font-size: 15px; font-weight: 500; text-decoration: none">{{c.label}}</a></li>
                </sc-for>
              </ul>
            </sc-if>
          </sc-if>
          <sc-if value="{{it.single}}" hint-placeholder-val="{{true}}">
            <a href="{{it.href}}" style="display: flex; align-items: center; min-height: 52px; padding: 0 20px; font-size: 16px; font-weight: 600; text-decoration: none">{{it.label}}</a>
          </sc-if>
        </li>
      </sc-for>
    </ul>
  </nav>

  <div style="padding: 16px 20px 24px; border-top: 1px solid #eee; font-size: 13px; color: #555">
    <p style="margin: 0">Butuh bantuan? <a href="#wa" style="color: #006659; font-weight: 600">Tanya Saffa via WhatsApp</a></p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: 'Program Kami' }; }
  renderVals() {
    const menu = [
      { label: 'Beranda', href: 'MobileBeranda.dc.html' },
      { label: 'Tentang Kami', children: [['Profil Relawan Nusantara', 'Profil.dc.html'], ['Audit Keuangan', 'Audit.dc.html'], ['Legalitas', 'Legalitas.dc.html']] },
      { label: 'Program Kami', children: [['Aksi Kemanusiaan', 'Pilar.dc.html'], ['Lingkungan', 'Pilar.dc.html'], ['Pendidikan', 'Pilar.dc.html'], ['Ekonomi', 'Pilar.dc.html']] },
      { label: 'Publikasi', children: [['Artikel', 'MobilePublikasi.dc.html'], ['Berita', 'MobilePublikasi.dc.html'], ['e-Report', 'EReport.dc.html']] },
      { label: 'Kemitraan', href: 'Kemitraan.dc.html' }
    ];
    const items = menu.map((m) => {
      const open = this.state.open === m.label;
      return {
        label: m.label, href: m.href, single: !m.children, hasChildren: !!m.children, open,
        expanded: open ? 'true' : 'false', sign: open ? '−' : '+',
        children: (m.children || []).map(([label, href]) => ({ label, href })),
        toggle: () => this.setState({ open: open ? null : m.label })
      };
    });
    return { items };
  }
}
</script>
</body>
</html>
