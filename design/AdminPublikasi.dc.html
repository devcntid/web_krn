<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Publikasi — Admin CMS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#006659}a:hover{color:#004d43}
</style>
</helmet>
<div style="font-family: Manrope, sans-serif; color: #10201d; background: #F5F7F6; display: flex; flex-wrap: wrap; min-height: 1150px">
  <div style="flex: 0 0 264px"><dc-import name="AdminSidebar" active="publikasi" hint-size="264px,1050px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 28px 36px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap">
      <div>
        <h1 style="margin: 0; font-size: 28px; font-weight: 800">Publikasi</h1>
        <p style="margin: 4px 0 0; font-size: 14px; color: #55615e">672 publikasi · Artikel, Berita, Kemitraan</p>
      </div>
      <a href="AdminEditor.dc.html" style="height: 44px; padding: 0 18px; border-radius: 10px; background: #006659; color: #fff; display: flex; align-items: center; text-decoration: none; font-weight: 800; font-size: 14px">+ Tulis Publikasi</a>
    </header>

    <div role="tablist" aria-label="Status" style="display: flex; gap: 6px; border-bottom: 1px solid #dfe5e3; flex-wrap: wrap">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
        <button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="height: 44px; padding: 0 14px; border: 0; background: transparent; border-bottom: 3px solid {{t.line}}; font: 700 14px Manrope, sans-serif; color: {{t.fg}}; cursor: pointer">{{t.label}} <span style="font-size: 12px; color: #55615e">{{t.count}}</span></button>
      </sc-for>
    </div>

    <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center">
      <label for="cari" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Cari publikasi</label>
      <input id="cari" type="search" placeholder="Cari judul atau slug…" style="flex: 1 1 280px; height: 42px; border: 1px solid #cfd6d4; border-radius: 10px; padding: 0 14px; font: 500 14px Manrope, sans-serif; background: #fff">
      <select aria-label="Kategori" style="height: 42px; border: 1px solid #cfd6d4; border-radius: 10px; padding: 0 12px; font: 600 14px Manrope, sans-serif; background: #fff"><option>Semua kategori</option><option>Artikel</option><option>Berita</option><option>Kemitraan</option></select>
      <select aria-label="Penulis" style="height: 42px; border: 1px solid #cfd6d4; border-radius: 10px; padding: 0 12px; font: 600 14px Manrope, sans-serif; background: #fff"><option>Semua penulis</option></select>
      <select aria-label="Bulan" style="height: 42px; border: 1px solid #cfd6d4; border-radius: 10px; padding: 0 12px; font: 600 14px Manrope, sans-serif; background: #fff"><option>Semua bulan</option><option>November 2026</option></select>
    </div>

    <section style="background: #fff; border: 1px solid #e2e7e5; border-radius: 14px; overflow: hidden">
      <div style="display: flex; gap: 10px; align-items: center; padding: 12px 16px; background: #fafbfb; border-bottom: 1px solid #edf0ef; font-size: 13px">
        <input type="checkbox" aria-label="Pilih semua" style="width: 18px; height: 18px">
        <span style="font-weight: 700">0 dipilih</span>
        <select aria-label="Aksi massal" style="height: 34px; border: 1px solid #cfd6d4; border-radius: 8px; padding: 0 10px; font: 600 13px Manrope, sans-serif; background: #fff"><option>Aksi massal…</option><option>Pindah kategori</option><option>Jadikan draf</option><option>Pindahkan ke sampah</option></select>
      </div>
      <div style="overflow-x: auto">
        <table style="width: 100%; border-collapse: collapse; font-size: 14px; min-width: 860px">
          <thead><tr style="text-align: left; color: #55615e; font-size: 12px; text-transform: uppercase; letter-spacing: .06em">
            <th style="padding: 12px 16px; width: 32px"></th><th style="padding: 12px 8px">Judul</th><th style="padding: 12px 8px">Kategori</th><th style="padding: 12px 8px">SEO</th><th style="padding: 12px 8px">Status</th><th style="padding: 12px 8px">Tanggal</th><th style="padding: 12px 16px"></th>
          </tr></thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
              <tr style="border-top: 1px solid #edf0ef">
                <td style="padding: 12px 16px"><input type="checkbox" aria-label="Pilih baris" style="width: 18px; height: 18px"></td>
                <td style="padding: 12px 8px">
                  <div style="display: flex; gap: 12px; align-items: center">
                    <span style="width: 56px; height: 40px; border-radius: 6px; background: #cfd8d4; flex: none"></span>
                    <span><a href="AdminEditor.dc.html" style="display: block; color: #10201d; text-decoration: none; font-weight: 800">{{r.title}}</a><span style="font-size: 12px; color: #55615e">/{{r.slug}}/</span></span>
                  </div>
                </td>
                <td style="padding: 12px 8px">{{r.cat}}</td>
                <td style="padding: 12px 8px"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{r.seoDot}}"></span>{{r.seo}}</span></td>
                <td style="padding: 12px 8px"><span style="font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: {{r.sbg}}; color: {{r.sfg}}">{{r.status}}</span></td>
                <td style="padding: 12px 8px; color: #55615e">{{r.date}}</td>
                <td style="padding: 12px 16px; text-align: right"><a href="AdminEditor.dc.html" style="font-weight: 700; font-size: 13px">Edit</a></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-top: 1px solid #edf0ef; font-size: 13px; color: #55615e; flex-wrap: wrap; gap: 10px">
        <span>Menampilkan 1–8 dari 672</span>
        <span style="display: flex; gap: 6px"><button type="button" style="height: 36px; min-width: 36px; border: 1px solid #cfd6d4; border-radius: 8px; background: #fff">‹</button><button type="button" style="height: 36px; min-width: 36px; border: 0; border-radius: 8px; background: #006659; color: #fff; font-weight: 800">1</button><button type="button" style="height: 36px; min-width: 36px; border: 1px solid #cfd6d4; border-radius: 8px; background: #fff">2</button><button type="button" style="height: 36px; min-width: 36px; border: 1px solid #cfd6d4; border-radius: 8px; background: #fff">…</button><button type="button" style="height: 36px; min-width: 36px; border: 1px solid #cfd6d4; border-radius: 8px; background: #fff">84</button><button type="button" style="height: 36px; min-width: 36px; border: 1px solid #cfd6d4; border-radius: 8px; background: #fff">›</button></span>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1150}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'Semua' }; }
  renderVals() {
    const tabs = [['Semua', '672'], ['Terbit', '672'], ['Review', '[n]'], ['Terjadwal', '[n]'], ['Draf', '[n]'], ['Sampah', '0']].map(([label, count]) => {
      const sel = this.state.tab === label;
      return { label, count, sel: sel ? 'true' : 'false', line: sel ? '#006659' : 'transparent', fg: sel ? '#006659' : '#3d4644', pick: () => this.setState({ tab: label }) };
    });
    const st = { Terbit: ['#e3f0ed', '#004d43'], Review: ['#fdf0d9', '#7a4b00'], Draf: ['#eceeed', '#3d4644'], Terjadwal: ['#e3ecf8', '#1d4a80'] };
    const seo = { Baik: '#1e8a4c', Perlu: '#c78400', Kurang: '#b3361f' };
    const rows = [
      ['Sebanyak 9.500 Liter Air Bersih Disalurkan untuk Warga Terdampak Kekeringan di Gorontalo', 'bantuan-air-bersih-warga-terdampak-kekeringan-gorontalo-3', 'Berita', 'Baik', 'Terbit', '11 Nov 2026'],
      ['Paket Makanan Disalurkan bagi Pasien Terdampak Konflik di Wad Medani, Sudan', 'bantuan-makanan-pasien-terdampak-konflik-sudan', 'Berita', 'Baik', 'Terbit', '02 Nov 2026'],
      ['Taman Zakat Dukung Relawan Karhutla dan Pejuang Nafkah di Palangka Raya', '[slug]', 'Berita, Kemitraan', 'Perlu', 'Terbit', '29 Oct 2026'],
      ['Perkuat Kesiapsiagaan Sesar Lembang, Masyarakat Ikuti Sekolah Lapang Gempa Bumi', '[slug]', 'Berita', 'Baik', 'Terbit', '29 Oct 2026'],
      ['Dukung Rehabilitasi Orangutan Kalimantan, Bantuan Pakan Disalurkan melalui YIARI', '[slug]', 'Berita', 'Perlu', 'Terbit', '28 Oct 2026'],
      ['Cara Mengetahui Kualitas Udara di Sekitarmu, Cek ISPU Sebelum Beraktivitas!', 'cara-cek-kualitas-udara-ispu', 'Artikel', 'Baik', 'Terbit', '21 Oct 2026'],
      ['[Draf publikasi baru]', '[slug]', 'Artikel', 'Kurang', 'Review', '—'],
      ['[Publikasi terjadwal]', '[slug]', 'Berita', 'Perlu', 'Terjadwal', '[tanggal]']
    ].map(([title, slug, cat, s, status, date]) => ({ title, slug, cat, seo: s, seoDot: seo[s], status, date, sbg: st[status][0], sfg: st[status][1] }));
    return { tabs, rows };
  }
}
</script>
</body>
</html>
