<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Publikasi mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700;1,800&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#006659}a:hover{color:#004d43}
.ph{background:#cfd8d4;color:#2d4a44;display:flex;align-items:center;justify-content:center;text-align:center;font:600 12px/1.4 Poppins,sans-serif;padding:8px;box-sizing:border-box}
</style>
</helmet>
<div style="width: 390px; height: 2500px; overflow: hidden; font-family: Poppins, sans-serif; color: #000; background: #F2F6F8">
  <header style="height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #fff; border-bottom: 1px solid #eee">
    <span style="display: flex; align-items: center; gap: 6px"><span style="width: 24px; height: 24px; border-radius: 3px; background: #006659"></span><span style="font-size: 12px; line-height: 12px; font-weight: 600; font-style: italic; color: #1d4d45">relawan<br>nusantara</span></span>
    <span style="display: flex; align-items: center; gap: 12px">
      <a href="#donasi" style="background: #F4A62A; color: #000; text-decoration: none; padding: 8px 18px; border-radius: 5px; font-size: 13px; font-weight: 700">Donasi</a>
      <a href="MobileMenu.dc.html" aria-label="Buka menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #000"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></a>
    </span>
  </header>

  <div style="position: relative; height: 300px; display: flex; align-items: flex-end; background: #7d8c80">
    <span class="ph" style="position: absolute; inset: 0; background: #7d8c80; color: rgba(255,255,255,.7)">FOTO HERO</span>
    <h1 style="position: relative; margin: 0; padding: 0 20px 24px; font-size: 40px; color: #fff">Berita</h1>
  </div>

  <section style="padding: 24px 20px">
    <h2 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 800">Kilas Perjuangan dari Nusantara</h2>
    <div role="tablist" aria-label="Kategori" style="margin-top: 18px; display: flex; gap: 8px; overflow-x: auto">
      <button type="button" role="tab" aria-selected="false" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 2px solid #006659; background: #fff; font: 500 14px Poppins, sans-serif">Artikel</button>
      <button type="button" role="tab" aria-selected="true" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 2px solid #006659; background: #006659; color: #fff; font: 500 14px Poppins, sans-serif">Berita</button>
      <button type="button" role="tab" aria-selected="false" style="height: 44px; padding: 0 18px; border-radius: 10px; border: 2px solid #006659; background: #fff; font: 500 14px Poppins, sans-serif">Kemitraan</button>
    </div>
    <label for="mcari" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Cari publikasi</label>
    <input id="mcari" type="search" placeholder="Search for News" style="margin-top: 12px; width: 100%; height: 44px; box-sizing: border-box; border: 0; border-radius: 6px; background: #e4e4e4; padding: 0 16px; font: 400 14px Poppins, sans-serif">

    <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 16px">
      <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
        <article style="background: #fff; border-radius: 10px; padding: 14px; box-shadow: 0 2px 18px rgba(0,0,0,.08)">
          <div class="ph" style="height: 200px; border-radius: 6px">FOTO · {{c.photo}}</div>
          <h3 style="margin: 14px 0 0; font-size: 17px; line-height: 1.35; font-weight: 800">{{c.title}}</h3>
          <div style="margin-top: 14px; display: flex; justify-content: space-between; align-items: center">
            <span style="font-size: 12px; color: #666">{{c.date}}</span>
            <a href="MobilePost.dc.html" style="background: #006659; color: #fff; text-decoration: none; padding: 12px 16px; border-radius: 6px; font-size: 12px; font-weight: 600">Selengkapnya</a>
          </div>
        </article>
      </sc-for>
    </div>
    <a href="#more" style="margin-top: 20px; display: flex; height: 48px; align-items: center; justify-content: center; border: 2px solid #006659; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px">Muat lebih banyak</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2500}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cards: [
        { title: 'Sebanyak 9.500 Liter Air Bersih Disalurkan untuk Warga Terdampak Kekeringan di Gorontalo', date: '11 Nov, 2026', photo: 'Air bersih' },
        { title: 'Paket Makanan Disalurkan bagi Pasien Terdampak Konflik di Wad Medani, Sudan', date: '02 Nov, 2026', photo: 'Wad Medani' },
        { title: 'Taman Zakat Dukung Relawan Karhutla dan Pejuang Nafkah di Palangka Raya', date: '29 Oct, 2026', photo: 'Karhutla' },
        { title: 'Perkuat Kesiapsiagaan Sesar Lembang, Masyarakat Ikuti Sekolah Lapang Gempa Bumi', date: '29 Oct, 2026', photo: 'Sekolah Lapang' }
      ]
    };
  }
}
</script>
</body>
</html>
