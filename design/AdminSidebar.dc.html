<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Sidebar Admin</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#d6e6e2}a:hover{color:#ffffff}
</style>
</helmet>
<aside style="font-family: Manrope, sans-serif; width: 264px; min-height: 1050px; height: 100%; background: #0F2E2A; color: #d6e6e2; display: flex; flex-direction: column; box-sizing: border-box; padding: 20px 14px">
  <div style="display: flex; align-items: center; gap: 10px; padding: 6px 8px 22px">
    <span style="width: 34px; height: 34px; border-radius: 8px; background: #006659; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 13px">RN</span>
    <span><span style="display: block; color: #fff; font-weight: 800; font-size: 15px">Relawan Nusantara</span><span style="display: block; font-size: 12px; color: #9fbfb8">Admin CMS</span></span>
  </div>
  <nav aria-label="Navigasi admin" style="display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <p style="margin: 14px 10px 6px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #8fb1aa">{{g.label}}</p>
      <sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
        <a href="{{it.href}}" aria-current="{{it.current}}" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 600; background: {{it.bg}}; color: {{it.fg}}">
          <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 2px; background: {{it.dot}}"></span>
          <span style="flex: 1">{{it.label}}</span>
          <sc-if value="{{it.badge}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; font-weight: 800; background: #F4A62A; color: #000; border-radius: 999px; padding: 2px 8px">{{it.badge}}</span></sc-if>
        </a>
      </sc-for>
    </sc-for>
  </nav>
  <div style="margin-top: auto; padding: 14px 10px 0; border-top: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; gap: 10px">
    <span style="width: 36px; height: 36px; border-radius: 50%; background: #2c5a52; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">PM</span>
    <span style="flex: 1"><span style="display: block; color: #fff; font-size: 13px; font-weight: 700">Project Manager</span><span style="display: block; font-size: 12px; color: #9fbfb8">Super Admin</span></span>
    <a href="AdminLogin.dc.html" aria-label="Keluar" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></a>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","publikasi","halaman","beranda","media","taksonomi","ereport","seo","pengguna","pengaturan","log"],"default":"dashboard"},"$preview":{"width":264,"height":1050}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const mk = (key, label, href, badge) => {
      const on = key === active;
      return { label, href, badge: badge || false, current: on ? 'page' : 'false', bg: on ? '#006659' : 'transparent', fg: on ? '#ffffff' : '#d6e6e2', dot: on ? '#F4A62A' : '#4f7d75' };
    };
    return {
      groups: [
        { label: 'Ringkasan', items: [mk('dashboard', 'Dashboard', 'AdminDashboard.dc.html')] },
        { label: 'Konten', items: [
          mk('publikasi', 'Publikasi', 'AdminPublikasi.dc.html', '4'),
          mk('halaman', 'Halaman', 'AdminHalaman.dc.html'),
          mk('beranda', 'Kelola Beranda', 'AdminBeranda.dc.html'),
          mk('media', 'Pustaka Media', 'AdminMedia.dc.html'),
          mk('taksonomi', 'Kategori & Tag', 'AdminTaksonomi.dc.html'),
          mk('ereport', 'e-Report & Audit', 'AdminEReport.dc.html')
        ] },
        { label: 'Sistem', items: [
          mk('seo', 'SEO & Redirect', 'AdminSeo.dc.html'),
          mk('pengguna', 'Pengguna & Peran', 'AdminPengguna.dc.html'),
          mk('pengaturan', 'Pengaturan Situs', 'AdminPengaturan.dc.html'),
          mk('log', 'Log Aktivitas', 'AdminLog.dc.html')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
